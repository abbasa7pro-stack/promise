<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promise Day for Zainy</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#ffdde1;
overflow:hidden;
text-align:center;
}

h1{
margin-top:10px;
color:#b3003b;
}

#game{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
padding:15px;
}

.card{
width:100%;
height:90px;
perspective:1000px;
}

.inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flipped .inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
padding:10px;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

.front{
background:#ff4d6d;
color:white;
}

.back{
background:white;
color:#b3003b;
transform:rotateY(180deg);
}

#stats{
display:flex;
justify-content:space-around;
font-size:18px;
margin:5px;
font-weight:bold;
}

#endScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#fff;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
animation:fadeIn 1s;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

#revealBtn{
padding:12px 20px;
font-size:18px;
background:#ff4d6d;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#finalMsg{
margin-top:20px;
width:80%;
font-size:20px;
color:#b3003b;
white-space:pre-line;
display:none;
}

.heart{
position:fixed;
color:#ff4d6d;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<h1>Promise Day for Zainy</h1>

<div id="stats">
<div>Score: <span id="score">0</span></div>
<div>Time: <span id="timer">60</span>s</div>
</div>

<div id="game"></div>

<div id="endScreen">
<button id="revealBtn">Tap to Reveal Message</button>
<div id="finalMsg"></div>
</div>

<script>

const promises = [
"I promise to always respect you",
"I promise to stand by you",
"I promise to listen to you",
"I promise to never hurt you intentionally",
"I promise to support your dreams",
"I promise to be honest with you",
"I promise to make you smile",
"I promise to always care for you"
];

const game = document.getElementById("game");
let score = 0;
let opened = 0;
let time = 60;

promises.forEach(text=>{
const card = document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="inner">
<div class="front">♥</div>
<div class="back">${text}</div>
</div>`;

card.onclick=()=>{
if(!card.classList.contains("flipped")){
card.classList.add("flipped");
score++;
opened++;
document.getElementById("score").innerText=score;

if(opened===promises.length){
endGame();
}
}
};

game.appendChild(card);
});

function endGame(){
clearInterval(timerInt);
setTimeout(()=>{
document.getElementById("endScreen").style.display="flex";
},800);
}

let timerInt=setInterval(()=>{
time--;
document.getElementById("timer").innerText=time;
if(time<=0) endGame();
},1000);

const message =
"Zainy,\n\n"+
"These are not just words on cards.\n"+
"They are promises from my heart.\n"+
"I may not be perfect, but my intentions for you are always real.\n"+
"Thank you for being someone so special in my life.\n\n"+
"Happy Promise Day.";

document.getElementById("revealBtn").onclick=()=>{
const box=document.getElementById("finalMsg");
box.style.display="block";
typeWriter(box,message);
document.getElementById("revealBtn").style.display="none";
};

function typeWriter(el,text,i=0){
if(i<text.length){
el.innerHTML+=text.charAt(i);
setTimeout(()=>typeWriter(el,text,i+1),40);
}
}

// floating hearts
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerText="♥";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=10+Math.random()*30+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},500);

</script>

</body>
</html>
