<!DOCTYPE html>
<html>
<head>
<title>Promise Game for Zainy</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body{
  margin:0;
  padding:0;
  font-family:Arial;
  text-align:center;
  background:#ffe6f0;
  overflow:hidden;
}

h1{ color:#cc0066; }

#info{ font-size:18px; margin:8px; }

.grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:10px;
  padding:10px;
}

.card{
  width:100%;
  aspect-ratio:1;
  perspective:1000px;
}

.inner{
  position:relative;
  width:100%;
  height:100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card.flip .inner{ transform: rotateY(180deg); }

.front, .back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  font-size:13px;
}

.front{ background:#ff66a3; color:white; }
.back{
  background:#cc0066;
  color:white;
  transform: rotateY(180deg);
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-20px;
  color:#ff4d88;
  animation: float 6s linear infinite;
}

@keyframes float{
  0%{ transform:translateY(0); opacity:1;}
  100%{ transform:translateY(-100vh); opacity:0;}
}

/* ending */
#puzzle{
  display:none;
  opacity:0;
  transition:1s;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>Promise Day Game for Zainy</h1>

<div id="info">
Score: <span id="score">0</span> |
Time Left: <span id="timer">60</span>s
</div>

<div class="grid" id="game"></div>

<!-- ENDING -->
<div id="puzzle">
  <button id="revealBtn" style="
    padding:12px 20px;
    font-size:16px;
    background:#cc0066;
    color:white;
    border:none;
    border-radius:8px;">
    Tap to Reveal Message ♥
  </button>

  <div id="finalContent" style="display:none; margin-top:20px;">
    <h2>My Biggest Promise</h2>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Red_heart.svg/512px-Red_heart.svg.png" width="200">

    <p id="typeText" style="font-size:16px; color:#cc0066;"></p>
  </div>
</div>

<script>

const items = [
"♥ I promise to always care for you",
"♥ I promise to respect your feelings",
"♥ I promise to make you smile",
"♥ I promise to support you always",
"♥ I promise to never ignore you",
"♥ I promise to listen to you patiently",
"♥ I promise to stand by you in tough times",
"♥ I promise to be honest with you",
"♥ I promise to value your happiness",
"♥ I promise to understand you even in silence",
"♥ I promise to never give up on you",
"♥ I promise to always keep you in my prayers"
];

items.sort(() => Math.random() - 0.5);

let revealed=0;
let score=0;
let time=60;

const game=document.getElementById("game");

items.forEach(text=>{
  let card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
  <div class="inner">
    <div class="front">Tap</div>
    <div class="back">${text}</div>
  </div>`;

  card.onclick=function(){
    if(!card.classList.contains("flip")){
      card.classList.add("flip");
      revealed++;
      score+=10;
      document.getElementById("score").innerText=score;

      if(revealed===items.length){
        showEnding();
      }
    }
  };

  game.appendChild(card);
});

/* timer */
setInterval(()=>{
  if(time>0){
    time--;
    document.getElementById("timer").innerText=time;
  }
},1000);

/* floating hearts */
function heart(){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="♥";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(20+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(heart,400);

/* ending functions */
function showEnding(){
  const p=document.getElementById("puzzle");
  p.style.display="block";
  setTimeout(()=>{ p.style.opacity="1"; },200);
}

const finalText =
"From all these little promises, there is one big truth — you are very special to me, and no matter what happens, I will always wish happiness, peace, and smiles for you. This game is just a small way to show how much you matter ♥";

function typeWriter(){
  let i=0;
  const speed=40;
  const area=document.getElementById("typeText");

  function typing(){
    if(i<finalText.length){
      area.innerHTML+=finalText.charAt(i);
      i++;
      setTimeout(typing,speed);
    }
  }
  typing();
}

document.getElementById("revealBtn").onclick=function(){
  this.style.display="none";
  document.getElementById("finalContent").style.display="block";
  typeWriter();
};

</script>

</body>
</html>
